<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BXH | BOXPVP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(255, 40, 40, .16),
                    transparent 40%
                ),
                #080808;
            color: #fff;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,.08);
            background: rgba(8,8,8,.88);
            backdrop-filter: blur(18px);
        }

        .navbar {
            max-width: 1180px;
            min-height: 72px;
            margin: auto;
            padding: 0 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 21px;
            font-weight: 900;
            white-space: nowrap;
        }

        .logo span {
            color: #ff3030;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a {
            color: rgba(255,255,255,.62);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            transition: .18s;
        }

        nav a:hover {
            color: white;
            background: rgba(255,255,255,.06);
        }

        nav a.active {
            color: white;
            background: rgba(255,48,48,.12);
            border: 1px solid rgba(255,48,48,.22);
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 55px 20px 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 21px;

            background:
                linear-gradient(
                    135deg,
                    #ff3030,
                    #8d0000
                );

            box-shadow:
                0 15px 45px rgba(255,0,0,.22);

            font-size: 30px;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -.8px;
        }

        .hero p {
            margin-top: 9px;
            color: rgba(255,255,255,.45);
            font-size: 14px;
        }

        .status {
            max-width: 760px;
            margin: 0 auto 24px;
            padding: 13px 17px;

            border-radius: 12px;

            background: rgba(0,255,100,.035);
            border: 1px solid rgba(0,255,100,.12);

            color: rgba(255,255,255,.55);
            text-align: center;
            font-size: 12px;
        }

        .box {
            overflow: hidden;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.018)
                );

            box-shadow:
                0 20px 60px rgba(0,0,0,.3);
        }

        .box-header {
            min-height: 70px;
            padding: 18px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .box-header h2 {
            font-size: 17px;
            font-weight: 900;
        }

        .refresh {
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;

            padding: 9px 13px;

            background: rgba(255,255,255,.045);
            color: white;

            cursor: pointer;

            font-size: 12px;
            font-weight: 800;

            transition: .18s;
        }

        .refresh:hover {
            background: rgba(255,48,48,.13);
            border-color: rgba(255,48,48,.25);
        }

        .table-header,
        .player-row {
            display: grid;

            grid-template-columns:
                65px
                minmax(190px, 1.5fr)
                1fr
                1fr
                1fr
                1fr;

            align-items: center;

            gap: 12px;
            padding: 0 20px;
        }

        .table-header {
            min-height: 48px;

            color: rgba(255,255,255,.38);

            font-size: 10px;
            font-weight: 900;

            text-transform: uppercase;

            border-bottom:
                1px solid rgba(255,255,255,.06);
        }

        .player-row {
            min-height: 75px;

            border-bottom:
                1px solid rgba(255,255,255,.055);

            transition: .15s;
        }

        .player-row:hover {
            background: rgba(255,255,255,.025);
        }

        .player-row:last-child {
            border-bottom: 0;
        }

        .position {
            font-size: 14px;
            font-weight: 900;
        }

        .position.top1 {
            color: #ffd43b;
            font-size: 19px;
        }

        .position.top2 {
            color: #cfd5df;
            font-size: 18px;
        }

        .position.top3 {
            color: #cd8b55;
            font-size: 18px;
        }

        .player {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #ff3030,
                    #720000
                );

            font-size: 14px;
            font-weight: 900;
        }

        .player-info {
            min-width: 0;
        }

        .player-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 14px;
            font-weight: 900;
        }

        .player-rank {
            margin-top: 3px;

            color: rgba(255,255,255,.38);

            font-size: 10px;
            font-weight: 700;
        }

        .value {
            font-size: 13px;
            font-weight: 800;
        }

        .money {
            color: #65df78;
        }

        .kills {
            color: #ff5555;
        }

        .deaths {
            color: #b7b7b7;
        }

        .shard {
            color: #8db5ff;
        }

        .loading,
        .empty {
            padding: 55px 20px;

            text-align: center;

            color: rgba(255,255,255,.42);

            font-size: 13px;
        }

        .error {
            color: #ff6262;
        }

        @media (max-width: 800px) {

            .navbar {
                padding: 14px;
                flex-direction: column;
            }

            nav {
                width: 100%;
                overflow-x: auto;
                justify-content: flex-start;
            }

            main {
                padding: 35px 12px 60px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .table-header,
            .player-row {
                grid-template-columns:
                    42px
                    minmax(150px, 1fr)
                    90px;
            }

            .table-header > div:nth-child(4),
            .table-header > div:nth-child(5),
            .table-header > div:nth-child(6),

            .player-row > div:nth-child(4),
            .player-row > div:nth-child(5),
            .player-row > div:nth-child(6) {
                display: none;
            }
        }

        @media (max-width: 500px) {

            .logo {
                font-size: 19px;
            }

            nav a {
                font-size: 11px;
                padding: 8px 9px;
            }

            .box-header {
                padding: 16px;
            }

            .table-header,
            .player-row {
                padding: 0 13px;
            }

            .player-row {
                min-height: 67px;
            }

            .avatar {
                width: 36px;
                height: 36px;
            }

            .player-name {
                font-size: 13px;
            }

            .value {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="navbar">

        <a href="../index.html" class="logo">
            ⚔️ <span>BOX</span>PVP
        </a>

        <nav>

            <a href="../index.html">
                🏠 Trang chủ
            </a>

            <a href="../topup/">
                🛒 Nạp
            </a>

            <a href="../code/">
                🎁 Code
            </a>

            <a href="../account/">
                👤 Tài khoản
            </a>

            <a href="../skin/">
                👕 Skin
            </a>

            <a href="./" class="active">
                🏆 BXH
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="hero">

        <div class="hero-icon">
            🏆
        </div>

        <h1>
            Bảng Xếp Hạng
        </h1>

        <p>
            Những người chơi hàng đầu của BOXPVP
        </p>

    </section>


    <div class="status" id="status">
        🟡 Đang kết nối dữ liệu...
    </div>


    <section class="box">

        <div class="box-header">

            <h2>
                🏆 TOP NGƯỜI CHƠI
            </h2>

            <button
                class="refresh"
                id="refresh"
            >
                ↻ Làm mới
            </button>

        </div>


        <div class="table-header">

            <div>
                #
            </div>

            <div>
                Người chơi
            </div>

            <div>
                Money
            </div>

            <div>
                Kills
            </div>

            <div>
                Deaths
            </div>

            <div>
                Shard
            </div>

        </div>


        <div id="ranking">

            <div class="loading">
                ⏳ Đang tải BXH...
            </div>

        </div>

    </section>

</main>


<script>

const API_URL =
    "https://boxpvp-backend.vercel.app";


const ranking =
    document.getElementById("ranking");


const status =
    document.getElementById("status");


const refresh =
    document.getElementById("refresh");


function number(value) {

    return Number(value || 0)
        .toLocaleString("vi-VN");

}


function safe(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function render(players) {

    if (!players.length) {

        ranking.innerHTML = `
            <div class="empty">
                🟡 Chưa có dữ liệu người chơi.
            </div>
        `;

        return;
    }


    ranking.innerHTML =
        players.map((player, index) => {

            const username =
                player.username ||
                player.name ||
                "Unknown";


            const rank =
                player.rank ||
                "Member";


            const initial =
                username.charAt(0).toUpperCase();


            let positionClass = "";

            if (index === 0) {
                positionClass = "top1";
            }

            if (index === 1) {
                positionClass = "top2";
            }

            if (index === 2) {
                positionClass = "top3";
            }


            return `

                <div class="player-row">

                    <div
                        class="position ${positionClass}"
                    >
                        ${index + 1}
                    </div>


                    <div class="player">

                        <div class="avatar">
                            ${safe(initial)}
                        </div>

                        <div class="player-info">

                            <div class="player-name">
                                ${safe(username)}
                            </div>

                            <div class="player-rank">
                                ${safe(rank)}
                            </div>

                        </div>

                    </div>


                    <div class="value money">
                        ${number(player.money)}
                    </div>


                    <div class="value kills">
                        ${number(player.kills)}
                    </div>


                    <div class="value deaths">
                        ${number(player.deaths)}
                    </div>


                    <div class="value shard">
                        ${number(player.shard)}
                    </div>

                </div>

            `;

        }).join("");

}


async function loadRanking() {

    ranking.innerHTML = `
        <div class="loading">
            ⏳ Đang tải BXH...
        </div>
    `;


    status.textContent =
        "🟡 Đang kết nối dữ liệu...";


    try {

        const response =
            await fetch(
                `${API_URL}/api/ranking`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        const players =
            Array.isArray(data.players)
                ? data.players
                : [];


        render(players);


        status.textContent =
            `🟢 Đã kết nối API • ${players.length} người chơi`;


    } catch (error) {

        console.error(
            "BOXPVP BXH:",
            error
        );


        ranking.innerHTML = `
            <div class="empty error">
                🔴 Không thể tải BXH.<br><br>
                API /api/ranking chưa hoạt động.
            </div>
        `;


        status.textContent =
            "🔴 Không thể kết nối API BXH.";

    }

}


refresh.addEventListener(
    "click",
    loadRanking
);


loadRanking();


setInterval(
    loadRanking,
    30000
);

</script>

</body>
</html>
